<body>
<div id="host"></div>
<script type="module">
import { compute } from "./engine.js";
import { watchCurrent, watchDisplay, now } from "./db.js";
import { mountOverlay } from "./overlay-core.js";
import { watchRelease, reloadTo } from "./release.js";

// ?test adds a grey background so the overlay can be checked in a normal browser.
if (new URLSearchParams(location.search).has("test")) document.body.style.background = "#5a6b52";

// If the design can't be loaded (a blip as the stream starts), try again rather than stay blank.
let ov;
try {
  const svgText = await (await fetch("overlay.svg?v=" + Date.now(), { cache: "no-store" })).text();
  ov = await mountOverlay(document.getElementById("host"), svgText);
} catch (e) { console.error(e); setTimeout(() => location.reload(), 5000); throw e; }

let cur = null, delayMs = 0;
watchCurrent(c => { cur = c; render(); });
// Stream delay (set on the control page, OVERRIDES → DISPLAY): the scoreboard shows the game as it was this
// long ago, so it lines up with a delayed video feed.
watchDisplay(d => { delayMs = Math.max(0, Math.min(5, Number(d.delay) || 0)) * 1000; render(); });
// No connection indicator here: viewers see this layer. The control page shows the connection.

// A newer release was published: reload at the next break in play (or after 15 min at the latest),
// so the graphics never blink out mid-point.
let updateSince = null, newRelease = null;
watchRelease(r => { if (!updateSince) { newRelease = r; updateSince = Date.now(); } });
const BREAKS = ["pre", "final", "half", "suspended", "paused"];

let shownGame = null;
function render() {
  const t = now() - delayMs;
  const events = delayMs && cur ? cur.events.filter(e => e.t == null || e.t <= t) : cur?.events;   // only what had happened by then
  // a game with no settings (deleted, or not arrived yet) shows nothing rather than a blank 0–0 bar
  const v = cur && cur.game?.settings ? compute(cur.game.settings, events, t) : null;
  // a different game: start the board afresh (it builds in) instead of animating the old game's scores away
  if ((cur?.id || null) !== shownGame) { if (shownGame) ov.update(null, t); shownGame = cur?.id || null; }
  if (updateSince && (!v || BREAKS.includes(v.status) || v.st.timeout || v.st.hidden || Date.now() - updateSince > 15 * 60000)) {
    updateSince = null; reloadTo(newRelease); return;
  }
  ov.update(v, t);
}
render();
setInterval(render, 250);
</script>
