<!-- Adobe Fonts kit (Bebas Neue Pro). The site's domain must be listed on the kit. -->
<link rel="stylesheet" href="https://use.typekit.net/mmy7scm.css">
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
  #host{position:absolute;inset:0}
  #dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:#f33;display:none}
</style>
</head>
<body>
<div id="host"></div>
<div id="dot" title="Not connected to the score database"></div>
<script type="module">
import { compute } from "./engine.js";
import { watchCurrent, onConnected, now } from "./db.js";
import { mountOverlay } from "./overlay-core.js";
import { watchRelease, reloadTo } from "./release.js";

// ?test adds a grey background so the overlay can be checked in a normal browser.
if (new URLSearchParams(location.search).has("test")) document.body.style.background = "#5a6b52";

const svgText = await (await fetch("overlay.svg?v=" + Date.now(), { cache: "no-store" })).text();
const ov = await mountOverlay(document.getElementById("host"), svgText);

let cur = null;
watchCurrent(c => { cur = c; render(); });
onConnected(ok => { document.getElementById("dot").style.display = ok ? "none" : "block"; });

// A newer release was published: reload at the next break in play (or after 15 min at the latest),
// so the graphics never blink out mid-point.
let updateSince = null, newRelease = null;
watchRelease(r => { if (!updateSince) { newRelease = r; updateSince = Date.now(); } });
const BREAKS = ["pre", "final", "half", "suspended", "paused"];

function render() {
  const t = now();
  const v = cur ? compute(cur.game.settings, cur.events, t) : null;
  if (updateSince && (!v || BREAKS.includes(v.status) || v.st.timeout || v.st.hidden || Date.now() - updateSince > 15 * 60000)) {
    updateSince = null; reloadTo(newRelease); return;
  }
  ov.update(v, t);
}
render();
setInterval(render, 250);
</script>
</body>
</html>
