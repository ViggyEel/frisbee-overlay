<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Match Control</title>
<link rel="stylesheet" href="https://use.typekit.net/mmy7scm.css">
<style>
/* Everything is sized in "canvas pixels" of an 844 × 390 landscape phone and scaled with --u. */
:root{
  --u: min(calc(100dvh / 390), calc(100dvw / 844));
  --bg:#0E0E0F; --panel:#141416; --btn:#2A2A2E; --dark:#1A1A1C; --row:#1E1E21; --line:#2A2A2C;
  --mut:#B9B9BE; --mut2:#85858B; --gold:#F2C230; --green:#2E7D4F; --red:#C8102E; --cancel:#3A1616; --cancelT:#F4C7C7;
  --font:"bebas-neue-pro","Bebas Neue Pro","Bebas Neue",Impact,"Arial Narrow",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:var(--font);font-weight:400;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden;overscroll-behavior:none}
input{-webkit-user-select:text;user-select:text;font-family:var(--font)}
button{font:inherit;font-weight:400;border:0;border-radius:0;color:#fff;background:var(--btn);cursor:pointer;touch-action:manipulation;
  display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*8);letter-spacing:calc(var(--u)*2);padding:0 calc(var(--u)*8);
  white-space:nowrap;overflow:hidden;min-width:0}
button.green{background:var(--green)} button.darkb{background:var(--dark);color:var(--mut)} button.cancel{background:var(--cancel);color:var(--cancelT)}
button.armed{background:var(--gold)!important;color:#111!important} button.armed.danger{background:var(--red)!important;color:#fff!important}
button.off{opacity:.3;pointer-events:none} button.sel{box-shadow:inset 0 0 0 calc(var(--u)*4) #fff} button.dim{opacity:.35}
svg{flex:0 0 auto}

#app{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  display:flex;align-items:center;justify-content:center}
#frame{width:calc(var(--u)*844);height:calc(var(--u)*390);display:grid;grid-template-columns:calc(var(--u)*281) 1fr;position:relative}
#left{display:grid;grid-template-rows:1fr 1fr;border-right:1px solid var(--line);min-height:0}
#right{background:var(--panel);padding:calc(var(--u)*22) calc(var(--u)*24) calc(var(--u)*22) calc(var(--u)*28);display:grid;min-height:0;row-gap:calc(var(--u)*16)}
#right.plain{background:var(--bg)}

.info{padding:calc(var(--u)*16);display:flex;flex-direction:column;gap:calc(var(--u)*6);min-height:0}
.toprow{display:flex;justify-content:space-between;align-items:center;font-size:calc(var(--u)*15);letter-spacing:calc(var(--u)*1)}
.status{color:var(--mut);white-space:nowrap;overflow:hidden;min-width:0;flex:1 1 auto} .status.gold{color:var(--gold)}
.conn{display:flex;align-items:center;gap:calc(var(--u)*6);color:#6FCF8E;font-size:calc(var(--u)*14);flex:0 0 auto;white-space:nowrap}
.conn i{width:calc(var(--u)*8);height:calc(var(--u)*8);border-radius:50%;background:currentColor;display:inline-block}
.conn.off{color:#F28B82}
.timer{font-size:calc(var(--u)*76);line-height:.9;letter-spacing:calc(var(--u)*2);font-weight:600;font-variant-numeric:tabular-nums}
.timer.grey{color:var(--mut)}
.infoline{font-size:calc(var(--u)*16);letter-spacing:calc(var(--u)*1);color:var(--mut);white-space:nowrap;overflow:hidden}
.last{margin-top:auto;border-top:1px solid var(--line);padding-top:calc(var(--u)*8);font-size:calc(var(--u)*20);letter-spacing:calc(var(--u)*1);white-space:nowrap;overflow:hidden}
.summary{padding:calc(var(--u)*16);display:flex;flex-direction:column;gap:calc(var(--u)*8);grid-row:1 / span 2}
.summary div{display:flex;align-items:center;gap:calc(var(--u)*10);font-size:calc(var(--u)*22);letter-spacing:calc(var(--u)*1);white-space:nowrap;overflow:hidden}
.summary i{width:calc(var(--u)*6);height:calc(var(--u)*22);flex:0 0 auto}

.plusrow{display:flex;gap:calc(var(--u)*10);align-items:center;justify-content:center;padding:0 calc(var(--u)*16) calc(var(--u)*16)}
.plusrow.locked{opacity:.35;pointer-events:none}
.plus{width:calc(var(--u)*120);height:calc(var(--u)*120);position:relative;flex-direction:column;gap:0;padding:0;font-weight:600}
.plus.a{clip-path:polygon(0 0,100% 0,calc(100% - var(--u)*22) 100%,0 100%);padding-right:calc(var(--u)*22)}
.plus.b{clip-path:polygon(calc(var(--u)*22) 0,100% 0,100% 100%,0 100%);padding-left:calc(var(--u)*22)}
.plus .p1{position:absolute;top:calc(var(--u)*8);font-size:calc(var(--u)*22);line-height:1}
.plus.a .p1{right:calc(var(--u)*26)} .plus.b .p1{right:calc(var(--u)*8)}
.plus .sc{font-size:calc(var(--u)*64);line-height:.9}
.plus .nm{font-size:calc(var(--u)*18);letter-spacing:calc(var(--u)*1);font-weight:400;max-width:85%;overflow:hidden}
.plus.armed .p1{font-size:calc(var(--u)*14)}

.now{font-size:calc(var(--u)*38);letter-spacing:calc(var(--u)*3)}
.r3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:calc(var(--u)*24);min-height:0}
.r2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:calc(var(--u)*24);min-height:0}
.big{font-size:calc(var(--u)*34)} .med{font-size:calc(var(--u)*28)} .sm{font-size:calc(var(--u)*22)}
.col{flex-direction:column;gap:calc(var(--u)*4)}
.sub{font-size:calc(var(--u)*20);opacity:.8;letter-spacing:calc(var(--u)*1)}
.bottom{display:flex;justify-content:space-between;align-items:stretch;height:calc(var(--u)*50)}
.bottom > *{width:calc(var(--u)*150)} .bottom > .wide{width:calc(var(--u)*240)}
.teambar{display:flex;align-items:center;justify-content:space-between;padding:0 calc(var(--u)*14);font-size:calc(var(--u)*28);letter-spacing:calc(var(--u)*2);height:calc(var(--u)*44)}
.grid{display:grid;gap:calc(var(--u)*16) calc(var(--u)*24);min-height:0}
.scroll{min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.rows{display:grid;gap:calc(var(--u)*6);align-content:start}
.lrow{display:grid;align-items:center;column-gap:calc(var(--u)*12);background:var(--row);padding-left:calc(var(--u)*12);height:calc(var(--u)*44);font-size:calc(var(--u)*22);letter-spacing:calc(var(--u)*1)}
.lrow .tm{color:var(--mut2);font-size:calc(var(--u)*20)} .lrow .tx{display:flex;align-items:center;gap:calc(var(--u)*10);white-space:nowrap;overflow:hidden}
.lrow .tx i{width:calc(var(--u)*6);height:calc(var(--u)*26);flex:0 0 auto} .lrow .scr{color:var(--mut);text-align:right}
.lrow button{height:100%}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) calc(var(--u)*54) calc(var(--u)*120) calc(var(--u)*54);column-gap:calc(var(--u)*8);background:var(--row);padding-left:calc(var(--u)*14);height:calc(var(--u)*46)}
.rrow span.l{align-self:center;font-size:calc(var(--u)*22);color:var(--mut);white-space:nowrap;overflow:hidden;letter-spacing:calc(var(--u)*1)}
.rrow span.v{align-self:center;text-align:center;font-size:calc(var(--u)*26);white-space:nowrap;overflow:hidden}
.rrow.off{opacity:.3} .rrow.off button{pointer-events:none}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:calc(var(--u)*8)}
.pad button{font-size:calc(var(--u)*30)}
.digit{display:grid;grid-template-rows:calc(var(--u)*44) 1fr calc(var(--u)*44);row-gap:calc(var(--u)*6);width:calc(var(--u)*72)}
.digit div{display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*84);line-height:1;font-weight:600}
.colon{display:flex;align-items:center;font-size:calc(var(--u)*84);color:var(--mut2)}
input.txt{width:100%;height:calc(var(--u)*56);font-size:calc(var(--u)*30);background:#000;color:#fff;border:1px solid #444;border-radius:0;padding:0 calc(var(--u)*12)}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:calc(var(--u)*10)}
.swatches button{height:calc(var(--u)*48)}
#rotate{display:none;position:fixed;inset:0;background:var(--bg);align-items:center;justify-content:center;font-size:32px;letter-spacing:2px;text-align:center;padding:24px}
@media (orientation:portrait){#rotate{display:flex}#app{display:none}}
</style>
</head>
<body>
<div id="app"><div id="frame"><div id="left"></div><div id="right"></div></div></div>
<div id="rotate">TURN THE PHONE SIDEWAYS</div>

<script type="module">
import { compute, fmt, fmtUp, describe, other, DEFAULTS } from "./engine.js?v=5";
import { watchCurrent, watchPresets, addEvent, removeEvent, updateEvent, saveSettings, newGame, deleteGame,
         onConnected, onPending, now, goalCounts, seedIfEmpty } from "./db.js?v=5";
import { SAMPLE } from "./sample-data.js?v=5";

// ---------------------------------------------------------------- state
let cur = null, presets = null, counts = {}, connected = false, waiting = 0, view = null;
let lastL = "", lastR = "", lastScr = "", ready = false;
const ui = { screen: null, armed: null, pull: null };   // screen: what the person opened; the game decides the rest
let armTimer = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

seedIfEmpty(SAMPLE);
watchPresets(p => { presets = p; render(); });
watchCurrent(c => { cur = c; render(); });
onConnected(ok => { connected = ok; render(); });
onPending(n => { waiting = n; render(); });
goalCounts().then(c => { counts = c; });

// ---------------------------------------------------------------- icons (Lucide)
const IC = {
  back: '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/></svg>',
  check: '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  trash: '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>',
  up: '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>',
  down: '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  minus: '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>',
  plus: '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>',
  pause: '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="4" height="16"/><rect x="15" y="4" width="4" height="16"/></svg>',
  play: '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>'
};

// ---------------------------------------------------------------- buttons
// b(action, arg, label, {cls, confirm, danger, off, style, armedLabel})
// confirm = needs the double tap: first tap arms it (gold, red if danger), a second within 2 s runs it.
function b(act, arg, label, o = {}) {
  const key = act + "|" + (arg ?? "");
  const armed = o.confirm && ui.armed === key;
  const cls = [o.cls || "", armed ? "armed" : "", armed && o.danger ? "danger" : "", o.off ? "off" : ""].join(" ");
  const shown = armed ? (o.armedLabel ?? "TAP AGAIN") : label;
  return `<button class="${cls}" data-act="${act}" data-arg="${esc(arg ?? "")}"${o.confirm ? ' data-confirm="1"' : ""}${o.style ? ` style="${o.style}"` : ""}>${shown}</button>`;
}
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if (!el || el.classList.contains("off")) return;
  const act = el.dataset.act, arg = el.dataset.arg;
  if (el.dataset.confirm) {
    const key = act + "|" + arg;
    if (ui.armed !== key) {
      ui.armed = key; clearTimeout(armTimer);
      armTimer = setTimeout(() => { ui.armed = null; render(); }, 2000);
      render(); return;
    }
    ui.armed = null; clearTimeout(armTimer);
  }
  if (ui.scorer) ui.scorer.idleAt = Date.now();
  (A[act] || (() => console.warn("no action", act)))(arg);
  render();
});
document.addEventListener("input", ev => {
  if (ev.target.id === "oneOffName" && ui.ng) ui.ng.oneOffName = ev.target.value.toUpperCase();
});
document.addEventListener("dblclick", e => e.preventDefault(), { passive: false });

// ---------------------------------------------------------------- helpers
const S = () => view ? view.s : DEFAULTS;
const name = t => String((t === "a" ? (S().barA || S().teamA) : (S().barB || S().teamB)) || "").toUpperCase();
const col = t => t === "a" ? S().colA : S().colB;
const ev = e => cur && addEvent(cur.id, e);
const squadOf = t => { const q = t === "a" ? S().squadA : S().squadB; return Array.isArray(q) && q.length ? q : null; };
const scorerOn = t => S().scorer !== false && !!squadOf(t);
function lastLog(v) {
  const L = v.st.log.filter(l => !["void"].includes(l.e.type));
  const l = L[L.length - 1];
  if (!l) return "";
  const score = ["point", "minus", "start", "call_outcome"].includes(l.e.type) ? ` · ${l.a}–${l.b}` : "";
  return describe(l.e, v.s, l.brk) + score + " · " + fmtUp(l.el);
}

// ---------------------------------------------------------------- what screen is showing
function screenOf(v) {
  if (ui.screen === "new") return "new";
  if (!cur || !v || !cur.game || !cur.game.settings) return ui.screen?.startsWith("ov") ? "home" : "home";
  const st = v.st;
  if (ui.screen?.startsWith("ov")) return ui.screen;
  if (st.ended) return ui.screen === "call_select" ? "call_select" : (st.call ? "call_open" : "home");
  if (!st.started) return "pregame";
  if (st.call) return "call_open";
  if (ui.screen === "call_select") return "call_select";
  if (st.timeout) return "timeout_run";
  if (ui.screen === "timeout_select") return "timeout_select";
  if (ui.scorer) return "scorer";
  if (st.suspended) return "suspended";
  if (st.inHalf) return "halftime";
  return "play";
}

// ---------------------------------------------------------------- left third
function leftHTML(v, scr) {
  if (scr === "new") return newSummary();
  const st = v?.st, s = v?.s || DEFAULTS;
  let status = "", gold = false;
  if (!v) status = "NO GAME";
  else if (st.ended) { status = "FINAL SCORE"; gold = true; }
  else if (scr === "pregame") status = "NOT STARTED";
  else if (st.call) { status = `${name(st.call.team)} CALLED ${st.call.call}`; gold = true; }
  else if (scr === "call_select") { status = "CALL"; gold = true; }
  else if (st.timeout) { status = `TIMEOUT · ${name(st.timeout.team)}`; gold = true; }
  else if (ui.scorer) { status = `+1 ${name(ui.scorer.team)}`; gold = true; }
  else if (st.suspended) { status = "SUSPENDED"; gold = true; }
  else if (st.inHalf) { status = "HALFTIME" + (s.clockStopsAtHalf ? " · CLOCK STOPPED" : ""); gold = true; }
  else if (st.pendingFinal) { status = "GAME POINT SCORED"; gold = true; }
  else if (st.paused) { status = "CLOCK PAUSED"; gold = true; }
  else if (v.capped) { status = `CAP · GAME TO ${st.target}`; gold = true; }
  else status = v.cdLabel ? "TO " + v.cdLabel : "";
  const conn = connected && !waiting ? `<span class="conn"><i></i>CONNECTED</span>`
    : `<span class="conn off"><i></i>${connected ? "SENDING" : "OFFLINE"}${waiting ? " · " + waiting + " WAITING" : ""}</span>`;
  const parts = v ? [`GAME TO ${st.target}${st.winBy2 ? " (BY 2)" : ""}`,
    s.halfEnabled !== false ? `HALF AT ${st.halfTarget}` : "",
    s.hardEnabled ? `CAP ${fmt(s.hardCapMin * 60000)}` : ""].filter(Boolean).join(" · ") : "";
  const lockedPlus = !v || scr !== "play" || st.ended || st.pendingFinal;
  const plus = t => {
    const sc = v ? st[t] : 0;
    const win = st?.ended && st.winner === t;
    const armedP = ui.armed === "plus|" + t;
    return `<button class="plus ${t}${armedP ? " armed" : ""}" data-act="plus" data-arg="${t}" data-confirm="1" style="background:${armedP ? "" : col(t)}">
      <span class="p1">${armedP ? "TAP AGAIN" : "+1"}</span><span class="sc" style="${win && !armedP ? "color:var(--gold)" : ""}">${sc}</span><span class="nm fit">${esc(name(t))}</span></button>`;
  };
  return `<div class="info">
      <div class="toprow"><span class="status${gold ? " gold" : ""} fit">${esc(status)}</span>${conn}</div>
      <div class="timer${!v || !st.started || st.ended || !st.running ? " grey" : ""}" id="timer"></div>
      <div class="infoline fit">${esc(parts)}</div>
      <div class="last fit">${esc(v ? lastLog(v) : "")}</div>
    </div>
    <div class="plusrow${lockedPlus ? " locked" : ""}">${plus("a")}${plus("b")}</div>`;
}

// ---------------------------------------------------------------- right side per screen
function rightHTML(v, scr) {
  const st = v?.st, s = v?.s;
  const R = (rows, html, plain) => { $("right").className = plain ? "plain" : ""; $("right").style.gridTemplateRows = rows; return html; };
  switch (scr) {
    case "home": {
      const canOv = !!(cur && cur.game && cur.game.settings);
      return R(`calc(var(--u)*118) 1fr`, `
        ${b("newgame", "", "NEW GAME", { cls: "green now" })}
        <div class="r3">
          ${b("callOpen", "", "CALL", { cls: "big", off: !canOv || !st?.started })}
          ${b("setup", "", "SETUP", { cls: "darkb med", off: true })}
          ${b("ov", "ov", "OVERRIDES", { cls: "darkb med", off: !canOv })}
        </div>`, true);
    }
    case "pregame":
      return R(`calc(var(--u)*118) 1fr`, `
        ${b("start", "", "START GAME", { cls: "now " + (ui.pull ? "green" : "darkb off"), confirm: true, armedLabel: "TAP AGAIN TO START" })}
        <div class="r3">
          ${b("pick", "a", `<span>${esc(name("a"))}</span><span>PULL</span>`, { cls: "col big" + (ui.pull === "a" ? " sel" : ui.pull ? " dim" : ""), style: `background:${col("a")}` })}
          ${b("pick", "b", `<span>${esc(name("b"))}</span><span>PULL</span>`, { cls: "col big" + (ui.pull === "b" ? " sel" : ui.pull ? " dim" : ""), style: `background:${col("b")}` })}
          ${b("ov", "ov", "OVERRIDES", { cls: "darkb med" })}
        </div>`, true);
    case "halftime":
    case "suspended": {
      const rule = st.pull, p = ui.pull ?? rule;
      const opt = t => b("pick", t, `<span>${esc(name(t))}</span><span>PULL</span>${p === t && t !== rule ? '<span class="sub" style="color:var(--gold)">OVERRIDE</span>' : ""}`,
        { cls: "col big" + (p === t ? " sel" : " dim"), style: `background:${col(t)}` });
      return R(`calc(var(--u)*118) 1fr`, `
        ${b("start2", p, scr === "suspended" ? "RESUME GAME" : "START 2ND HALF", { cls: "green now", confirm: true, armedLabel: "TAP AGAIN TO START" })}
        <div class="r3">${opt("a")}${opt("b")}${b("ov", "ov", "OVERRIDES", { cls: "darkb med" })}</div>`, true);
    }
    case "play": {
      let ctx = "";
      if (st.pendingFinal) ctx = b("confirmFinal", "", "CONFIRM FINAL", { cls: "green now", confirm: true });
      else if (st.paused) ctx = b("resume", "", "RESUME CLOCK", { cls: "green now", confirm: true });
      else if (v.status === "lastPossession") ctx = b("end", "", "END GAME", { cls: "now", confirm: true, danger: true });
      else if (v.halfButton) ctx = b("half", "", "HALFTIME", { cls: "now", confirm: true });
      else if (s.breakChance && st.pull) ctx = b("bc", "", st.breakChance ? "BREAK CHANCE · ON" : `BREAK CHANCE · ${esc(name(st.pull))}`,
        { cls: "now", confirm: true, style: st.breakChance ? "background:#5A4600" : "" });
      else ctx = `<div style="border:1px solid var(--line)"></div>`;
      const tl = v.timeoutsLeft;
      const toOn = s.toCount > 0;
      return R(`calc(var(--u)*118) 1fr`, `${ctx}
        <div class="r3">
          ${b("callOpen", "", "CALL", { cls: "big", off: s.calls === false })}
          ${b("toOpen", "", `<span>TIMEOUT</span>${toOn ? `<span class="sub">${esc(name("a"))} · ${tl.a}</span><span class="sub">${esc(name("b"))} · ${tl.b}</span>` : ""}`, { cls: "col big", off: !toOn || (tl.a + tl.b === 0) })}
          ${b("ov", "ov", "OVERRIDES", { cls: "darkb med" })}
        </div>`, true);
    }
    case "call_select": {
      const c = ui.call || (ui.call = { team: null, page: 0 });

// ---------------------------------------------------------------- scorer picker
function scorerHTML() {
  const sc = ui.scorer, t = sc.team, squad = squadOf(t) || [];

  const goals = counts[key] || {};
  const g = p => goals[p.n || p.name] || 0;
  const exact = sc.typed ? squad.find(p => p.n === sc.typed) : null;
  const chosen = sc.pick || exact;
  const noNum = squad.filter(p => !p.n);
  let top = squad.filter(p => p.n && (!sc.typed || p.n.startsWith(sc.typed))).sort((x, y) => g(y) - g(x)).slice(0, 5);
  if (chosen && chosen.n && !top.includes(chosen)) top = [chosen, ...top.slice(0, 4)];
  const list = [...noNum, ...top];
  const shown = chosen ? (chosen.n ? "#" + chosen.n + " " : "") + chosen.name : sc.typed ? "#" + sc.typed : "";
  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "back"].map(k =>

// ---------------------------------------------------------------- clock editor
function clockHTML(v) {
  const st = v.st, s = v.s;
  if (ui.clockVal == null) ui.clockVal = Math.ceil((v.remaining ?? 0) / 1000), ui.clockOrig = ui.clockVal;
  const val = ui.clockVal, m = Math.floor(val / 60), sec = val % 60;
  const longest = Math.max(s.softCapMin || 0, s.hardCapMin || 0, s.halfCapMin || 0);
  const mStr = String(m).padStart(longest >= 100 ? 3 : 2, "0");
  const digits = (mStr + String(sec).padStart(2, "0")).split("");
  const origStr = String(Math.floor(ui.clockOrig / 60)).padStart(mStr.length, "0") + String(ui.clockOrig % 60).padStart(2, "0");
  const cols = digits.map((d, i) => `${i === mStr.length ? '<div class="colon">:</div>' : ""}<div class="digit">
      ${b("dig", i + ":1", IC.up, { style: "font-size:calc(var(--u)*28)" })}
      <div style="color:${d !== origStr[i] ? "var(--gold)" : "#fff"}">${d}</div>
      ${b("dig", i + ":-1", IC.down, { style: "font-size:calc(var(--u)*28)" })}</div>`).join("");
  const changed = val !== ui.clockOrig;
  return `${b("pauseToggle", "", st.paused ? `${IC.play} RESUME CLOCK` : `${IC.pause} PAUSE CLOCK`, { cls: "med" + (st.paused ? " green" : "") + (!st.started || st.ended ? " off" : ""), confirm: true })}
    <div style="display:flex;justify-content:center;gap:calc(var(--u)*12)">${cols}</div>
    <div class="bottom">${b("back", "", "BACK", { cls: "darkb sm" })}${b("clockSet", "", `${IC.check} SET`, { cls: "wide med " + (changed && v.cdTarget != null ? "green" : "darkb off"), confirm: true })}</div>`;
}

// ---------------------------------------------------------------- new game flow
const ROUNDS = ["POOL", "SWISS ROUND", "CROSSOVER", "ROUND OF 32", "ROUND OF 16", "PRE-QUARTER-FINAL", "QUARTER-FINAL", "SEMI-FINAL",
                "FINAL", "3RD PLACE PLAYOFF", "PLACEMENT", "FRIENDLY"];
const PLACES = ["5TH", "7TH", "9TH", "11TH", "13TH", "15TH"];
const SWATCH = ["#2E2E2E", "#6B1D32", "#1F4E79", "#1E5631", "#5B2A86", "#8A5A00"];
function roundText(n) {
  const r = ROUNDS[n.round];
  if (r === "POOL") return "POOL " + "ABCDEFGH"[n.sub % 8];
  if (r === "SWISS ROUND") return "SWISS ROUND " + ((n.sub % 8) + 1);
  if (r === "PLACEMENT") return PLACES[n.sub % PLACES.length] + " PLACE PLAYOFF";
  return r;
}
function teamPick(id) {   // "teamId/squadId" | "teamId" | "oneoff:NAME:#col"
  if (!id) return null;
  if (id.startsWith("oneoff:")) { const [, nm, c] = id.split(":"); return { name: nm, bar: "", col: c, text: "#FFFFFF", squad: null, squadName: "", key: null }; }
  const [tid, sid] = id.split("/");
  const T = presets.teams[tid] || {}, Q = sid && T.squads ? T.squads[sid] : null;
  return { name: T.name, bar: T.bar || "", col: T.col, text: T.text || "#FFFFFF", squad: Q ? Q.players || null : null,
           squadName: Q ? Q.name : "", key: Q ? tid + "/" + sid : null };
}
const teamLabel = p => p ? (p.name + (p.squadName ? " " + p.squadName : "")).toUpperCase() : "";
function newSummary() {
  const n = ui.ng, T = n.t && presets.tournaments[n.t];
  const lines = [];
  if (T) lines.push([T.name.toUpperCase(), "#3A3A3E"]);
  if (n.div) lines.push([n.div.toUpperCase(), "#3A3A3E"]);
  const A = teamPick(n.a), B = teamPick(n.b);
  if (A) lines.push([teamLabel(A), A.col]);
  if (B) lines.push(["V " + teamLabel(B), B.col]);
  if (n.step >= 5) {
    const rs = Object.values(T.ruleSets || {})[n.rule]; lines.push([(rs?.name || "").toUpperCase(), "#3A3A3E"]);
    lines.push([roundText(n), "#3A3A3E"]);
    lines.push([(n.darks === 0 ? teamLabel(A) : teamLabel(B)) + " IN DARKS", "#3A3A3E"]);
  }
  return `<div class="summary">${lines.map(([t, c]) => `<div><i style="background:${c}"></i><span class="fit">${esc(t)}</span></div>`).join("")}</div>`;
}
function newHTML() {
  const n = ui.ng;
  if (!presets) return `<div></div><div class="bottom">${b("ngBack", "", "BACK", { cls: "darkb sm" })}</div>`;
  const home = presets.home, H = presets.teams[home] || {};
  let opts = [];
  if (n.step === 0) opts = Object.entries(presets.tournaments).map(([id, T]) => [id, T.name, "#2A2A2E"]);
  else if (n.step === 1) opts = (presets.tournaments[n.t].divisions || []).map(d => [d, d, "#2A2A2E"]);
  else if (n.step === 2) opts = [...Object.entries(H.squads || { "": { name: "" } }).map(([sid, Q]) => [home + (sid ? "/" + sid : ""), (H.name + " " + Q.name).trim(), H.col]), ["notus", "NOT US", "#2A2A2E"]];
  else if (n.step === 3 || n.step === 4) {
    if (n.oneOff) {
      return `<div style="display:flex;flex-direction:column;gap:calc(var(--u)*16)">
          <input class="txt" id="oneOffName" placeholder="TEAM NAME" value="${esc(n.oneOffName || "")}" maxlength="24">
          <div class="swatches">${SWATCH.map(c => b("swatch", c, "", { style: `background:${c};${n.oneOffCol === c ? "box-shadow:inset 0 0 0 calc(var(--u)*4) #fff" : ""}` })).join("")}</div>
        </div>
        <div class="bottom">${b("ngBack", "", "BACK", { cls: "darkb sm" })}${b("oneOffOk", "", `${IC.check} OK`, { cls: "wide med green" })}</div>`;
    }
    const used = [n.a, n.b].filter(Boolean).map(x => x.split("/")[0]);
    for (const [tid, T] of Object.entries(presets.teams)) {
      if (n.a !== "notus" && tid === home && n.step === 3 && n.a) continue;
      if (used.includes(tid)) continue;
      const sq = Object.entries(T.squads || {});
      if (sq.length) sq.forEach(([sid, Q]) => opts.push([tid + "/" + sid, T.name + " " + Q.name, T.col]));
      else opts.push([tid, T.name, T.col]);
    }
    opts.push(["oneoff", "ONE-OFF TEAM", "#2A2A2E"]);
  }
  if (n.step <= 4) {
    return `<div class="scroll"><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:calc(var(--u)*64);gap:calc(var(--u)*14) calc(var(--u)*20)">
        ${opts.map(([id, label, c]) => b("ngPick", id, esc(String(label).toUpperCase()), { cls: "med fit", style: `background:${c}` })).join("")}
      </div></div>
      <div class="bottom">${b("ngBack", "", "BACK", { cls: "darkb sm" })}</div>`;
  }
  // details
  const T = presets.tournaments[n.t], rsets = Object.values(T.ruleSets || {});
  const A = teamPick(n.a), B = teamPick(n.b);
  const r = ROUNDS[n.round];
  const subLabel = r === "POOL" ? "ABCDEFGH"[n.sub % 8] : r === "SWISS ROUND" ? String((n.sub % 8) + 1) : r === "PLACEMENT" ? PLACES[n.sub % PLACES.length] : "—";
  const row = (k, label, value, off) => `<div class="rrow${off ? " off" : ""}"><span class="l">${label}</span>${b("ngCyc", k + ":-1", IC.minus, { style: "font-size:calc(var(--u)*22)" })}
      <span class="v fit">${esc(value)}</span>${b("ngCyc", k + ":1", IC.plus, { style: "font-size:calc(var(--u)*22)" })}</div>`;
  return `<div class="rows" style="grid-auto-rows:calc(var(--u)*50)">
      ${row("rule", "RULE SET", (rsets[n.rule]?.name || "").toUpperCase(), rsets.length < 2)}
      ${row("round", "ROUND", r)}
      ${row("sub", "POOL / NO.", subLabel, subLabel === "—")}
      ${row("darks", "DARKS", n.darks === 0 ? teamLabel(A) : teamLabel(B))}
      ${row("left", "LEFT", n.left === 0 ? teamLabel(A) : teamLabel(B))}
    </div>
    <div class="bottom">${b("ngBack", "", "BACK", { cls: "darkb sm" })}${b("create", "", "CREATE GAME", { cls: "wide med green", confirm: true })}</div>`;
}

// ---------------------------------------------------------------- actions
const A = {
  none() {},
  plus(t) {
    if (!view || view.st.pendingFinal) return;
    if (scorerOn(t)) ui.scorer = { team: t, typed: "", pick: null, idleAt: Date.now() };
    else ev({ type: "point", team: t });
  },
  key(k) {
    const sc = ui.scorer; if (!sc) return;
    sc.pick = null;
    sc.typed = k === "back" ? sc.typed.slice(0, -1) : (sc.typed + k).slice(0, 2);
  },
  pickPlayer(i) { const sc = ui.scorer; sc.pick = (squadOf(sc.team) || [])[+i]; sc.typed = ""; },
  scorerConfirm() { finishScorer(); },
  scorerCancel() { ui.scorer = null; },
  pick(t) { ui.pull = t; },
  start() { if (ui.pull) { ev({ type: "start", pull: ui.pull }); ui.pull = null; } },
  start2(p) { ev({ type: "start", pull: p || view.st.pull }); ui.pull = null; },
  bc() { ev({ type: "breakchance", on: !view.st.breakChance }); },
  half() { ev({ type: "half" }); ui.screen = null; },
  resume() { ev({ type: "resume" }); },
  end() { ev({ type: "end" }); ui.screen = null; },
  confirmFinal() { ev({ type: "confirm_final" }); },
  suspend() { ev({ type: "suspend" }); ui.screen = null; },
  resumePlay() {                                            // a game ended by mistake: remove the end / confirmation
    const L = view.st.log.filter(l => ["end", "confirm_final"].includes(l.e.type));
    const last = L[L.length - 1]; if (last) removeEvent(cur.id, last.e.key);
    ui.screen = null;
  },
  callOpen() { ui.screen = "call_select"; ui.call = { team: null, page: 0 }; },
  callTeam(t) { ui.call.team = t; },
  callPage() { ui.call.page = (ui.call.page + 1) % 4; },
  callType(type) { ev({ type: "call", team: ui.call.team, call: type }); ui.screen = null; ui.removePoint = false; },
  callCancel() { ui.screen = null; },
  removeToggle() { ui.removePoint = !ui.removePoint; },
  outcome(o) {
    const st = view.st;
    if (ui.removePoint && st.lastPointKey) ev({ type: "void", ref: st.lastPointKey });
    ev({ type: "call_outcome", outcome: o, removedPoint: ui.removePoint && !!st.lastPointKey ? true : undefined });
    ui.removePoint = false;
  },
  callDelete() { removeEvent(cur.id, view.st.call.key); ui.removePoint = false; },
  callEdit() { const c = view.st.call; removeEvent(cur.id, c.key); ui.screen = "call_select"; ui.call = { team: c.team, page: 0 }; },
  toOpen() { ui.screen = "timeout_select"; },
  toCancelSel() { ui.screen = null; },
  toTeam(t) { ev({ type: "timeout", team: t }); ui.screen = null; },
  toResume() { ev({ type: "timeout_end" }); },
  toCancel() { removeEvent(cur.id, view.st.timeout.key); },
  ov(k) { ui.screen = k; ui.pullFix = null; ui.clockVal = null; ui.rules = null; },
  back() { ui.screen = ui.screen === "ov" ? null : (ui.screen?.startsWith("ov_") ? "ov" : null); ui.rules = null; ui.clockVal = null; ui.pullFix = null; },
  del(key) {
    const l = view.st.log.find(x => x.e.key === key);
    if (l && l.e.type === "start" && view.st.log[0]?.e.key === key) { deleteGame(cur.id); ui.screen = null; return; }
    removeEvent(cur.id, key);
    // deleting a call outcome that removed a point also brings the point back
    if (l && l.e.type === "call_outcome") for (const x of cur.events) if (x.type === "void" && Math.abs(x.t - l.e.t) < 1500) removeEvent(cur.id, x.key);
  },
  editScorer(key) {
    const e = cur.events.find(x => x.key === key); if (!e || !scorerOn(e.team)) return;
    ui.scorer = { team: e.team, typed: "", pick: null, idleAt: Date.now(), editKey: key }; ui.screen = null;
  },
  pullPick(t) { ui.pullFix = t; },
  pullConfirm() { if (ui.pullFix && ui.pullFix !== view.st.pull) ev({ type: "pull_set", team: ui.pullFix }); ui.pullFix = null; },
  pauseToggle() { ev({ type: view.st.paused ? "resume" : "pause" }); },
  dig(arg) {
    const [i, d] = arg.split(":").map(Number);
    const v = ui.clockVal, m = Math.floor(v / 60), sec = v % 60;
    const longest = Math.max(S().softCapMin || 0, S().hardCapMin || 0, S().halfCapMin || 0);
    const mStr = String(m).padStart(longest >= 100 ? 3 : 2, "0");
    const places = [...mStr.split("").map((c, j) => ({ v: +c, max: 9, w: 10 ** (mStr.length - 1 - j) * 60 })),
                    { v: Math.floor(sec / 10), max: 5, w: 10 }, { v: sec % 10, max: 9, w: 1 }];
    const p = places[i], nv = (p.v + d + p.max + 1) % (p.max + 1);
    ui.clockVal = Math.max(0, v + (nv - p.v) * p.w);
  },
  clockSet() {
    if (view.cdTarget == null) return;
    // remaining becomes exactly the entered value at this moment, a fresh whole second
    ev({ type: "clock_set", elapsed: Math.max(0, view.cdTarget - ui.clockVal * 1000) });
    ui.clockOrig = ui.clockVal;
  },
  rule(arg) {
    const [i, d] = arg.split(":").map(Number), def = RULES[i], r = ui.rules, k = def[0];
    if (def[2] === "bool") r[k] = !r[k];
    else if (def[2] === "opt") { const o = def[3], j = o.findIndex(z => z[0] == r[k]); r[k] = o[(j + d + o.length) % o.length][0]; }
    else r[k] = Math.max(0, Number(r[k]) + d * def[3]);
  },
  rulesSave() { const keep = Object.fromEntries(RULES.map(d => [d[0], ui.rules[d[0]]])); saveSettings(cur.id, { ...cur.game.settings, ...keep }); ui.rules = null; },
  display() { ev({ type: "display", hidden: !view.st.hidden }); },
  newgame() { ui.screen = "new"; ui.ng = { step: 0, t: null, div: null, a: null, b: null, rule: 0, round: 0, sub: 0, darks: 0, left: 0 }; },
  setup() {},
  ngBack() {
    const n = ui.ng;
    if (n.oneOff) { n.oneOff = false; return; }
    if (n.step === 0) { ui.screen = null; return; }
    n.step--;
    if (n.step === 0) n.t = null; if (n.step === 1) n.div = null; if (n.step === 2) n.a = null; if (n.step === 3) n.b = null;
    if (n.step === 4 && n.a !== "notus") n.step = 3, n.b = null;
  },
  ngPick(id) {
    const n = ui.ng;
    if (n.step === 0) { n.t = id; n.step = 1; return; }
    if (n.step === 1) { n.div = id; n.step = 2; return; }
    if (n.step === 2) { n.a = id === "notus" ? null : id; n.notUs = id === "notus"; n.step = 3; return; }
    if (id === "oneoff") { n.oneOff = true; n.oneOffName = ""; n.oneOffCol = SWATCH[0]; return; }
    if (n.step === 3 && n.notUs && !n.a) { n.a = id; return; }      // not us: first pick = team A, stay for team B
    n.b = id; n.step = 5;
  },
  swatch(c) { ui.ng.oneOffCol = c; },
  oneOffOk() {
    const n = ui.ng, nm = (n.oneOffName || "").trim(); if (!nm) return;
    n.oneOff = false; A.ngPick(`oneoff:${nm.replace(/:/g, " ")}:${n.oneOffCol}`);
  },
  ngCyc(arg) {
    const [k, d] = arg.split(":"), n = ui.ng, dir = Number(d);
    const lim = { rule: Object.keys(presets.tournaments[n.t].ruleSets || {}).length || 1, round: ROUNDS.length, sub: 8, darks: 2, left: 2 }[k];
    n[k] = (n[k] + dir + lim) % lim;
  },
  create() {
    const n = ui.ng, T = presets.tournaments[n.t];
    const rs = { ...(Object.values(T.ruleSets || {})[n.rule] || {}) };
    const rsName = rs.name; delete rs.name;
    const P = [teamPick(n.a), teamPick(n.b)];
    const L = n.left === 0 ? P : [P[1], P[0]];           // team A is always the left team on the scorebar
    const darksTeam = P[n.darks], darks = L[0] === darksTeam ? "a" : "b";
    const settings = {
      ...rs, ruleSet: rsName || "",
      tournament: T.name, division: n.div, label: roundText(n),
      eventText: T.eventText || "", eventLogo: T.eventLogo || "", eventBg: T.eventBg || "#ECECEC",
      teamA: L[0].name, barA: L[0].bar, colA: L[0].col, colAText: L[0].text, squadA: L[0].squad || null, squadKeyA: L[0].key || null,
      teamB: L[1].name, barB: L[1].bar, colB: L[1].col, colBText: L[1].text, squadB: L[1].squad || null, squadKeyB: L[1].key || null,
      darks
    };
    for (const k of Object.keys(settings)) if (settings[k] === null || settings[k] === undefined) delete settings[k];
    newGame(settings);
    ui.screen = null; ui.ng = null; ui.pull = null;
  }
};

function finishScorer() {
  const sc = ui.scorer; if (!sc) return;
  const squad = squadOf(sc.team) || [];
  const exact = sc.typed ? squad.find(p => p.n === sc.typed) : null;
  const p = sc.pick || exact;
  const scorer = p ? (p.n || undefined) : (sc.typed || undefined);
  const scorerName = p ? p.name : undefined;
  if (sc.editKey) updateEvent(cur.id, sc.editKey, { scorer: scorer || null, scorerName: scorerName || null });
  else ev({ type: "point", team: sc.team, scorer, scorerName });
  const key = sc.team === "a" ? S().squadKeyA : S().squadKeyB, who = scorer || scorerName;
  if (key && who) { (counts[key] ||= {})[who] = (counts[key][who] || 0) + 1; }
  ui.scorer = null;
}

// ---------------------------------------------------------------- render
function render() {
  if (!ready) return;
  const t = now();
  view = cur && cur.game && cur.game.settings ? compute(cur.game.settings, cur.events, t) : null;
  const scr = screenOf(view);
  if (scr !== lastScr) { ui.armed = null; lastScr = scr; }
  if (scr === "pregame" && ui.pull == null) ui.pull = null;
  const L = leftHTML(view, scr), Rh = rightHTML(view, scr);
  if (L !== lastL) { $("left").innerHTML = L; lastL = L; fitAll($("left")); }
  if (Rh !== lastR) {
    const sc = $("right").querySelector(".scroll"), top = sc ? sc.scrollTop : 0;
    $("right").innerHTML = Rh; lastR = Rh; fitAll($("right"));
    const sc2 = $("right").querySelector(".scroll"); if (sc2) sc2.scrollTop = top;
  }
  tick(t);
}
function tick(t = now()) {
  const v = view;
  const tm = $("timer");
  if (tm) tm.textContent = v ? (v.remaining == null ? (v.st.started ? "00:00" : "--:--") : fmt(v.remaining)) : "--:--";
  const tc = $("toCount");
  if (tc && v?.st.timeout) {
    const len = v.s.toLenSec * 1000, left = len ? Math.max(0, len - (t - v.st.timeout.t)) : null;
    tc.textContent = left == null ? "" : fmt(left).replace(/^0/, "");
    tc.style.color = left === 0 ? "var(--gold)" : "#fff";
  }
  const cb = $("confirmBtn");
  if (cb && ui.scorer) {
    const left = Math.max(0, 5000 - (Date.now() - ui.scorer.idleAt)), pct = left / 50;
    cb.style.background = `linear-gradient(90deg, var(--green) 0%, var(--green) ${pct}%, #1E3D2B ${pct}%, #1E3D2B 100%)`;
    if (left === 0) { finishScorer(); render(); }
  }
}
// Shrink text that does not fit its box (same idea as the overlay's name fit).
function fitAll(root) {
  root.querySelectorAll(".fit, button, .infoline, .last, .status").forEach(el => {
    el.style.fontSize = "";
    let size = parseFloat(getComputedStyle(el).fontSize), guard = 0;
    const over = () => el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1;
    while (over() && size > 10 && guard++ < 60) { size -= 1; el.style.fontSize = size + "px"; }
  });
}
// The scroll area is touched → keep the scorer timer alive.
document.addEventListener("touchstart", () => { if (ui.scorer) ui.scorer.idleAt = Date.now(); }, { passive: true });
document.addEventListener("scroll", () => { if (ui.scorer) ui.scorer.idleAt = Date.now(); }, { capture: true, passive: true });
addEventListener("resize", () => { lastL = lastR = ""; render(); });
ready = true;
setInterval(render, 250);
render();
</script>
</body>
</html>
